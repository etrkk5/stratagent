[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stratagent-cli"
version = "0.9.0"
description = "StratAgent: a platform-agnostic agent workspace architect with reviewed skills and MCP provenance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["PyYAML==6.0.3"]

[project.urls]
Homepage = "https://github.com/etrkk5/stratagent"
Repository = "https://github.com/etrkk5/stratagent"
Issues = "https://github.com/etrkk5/stratagent/issues"
Documentation = "https://github.com/etrkk5/stratagent#readme"

[project.scripts]
stratagent = "stratagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stratagent = ["data/*.json", "data/skills/stratagent/*.md"]
