[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratagent-cli"
version = "0.3.2"
description = "StratAgent: a platform-agnostic agent workspace architect with reviewed skills and MCP provenance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.urls]
Homepage = "https://github.com/etrkk5/stratagent"
Repository = "https://github.com/etrkk5/stratagent"
Issues = "https://github.com/etrkk5/stratagent/issues"
Documentation = "https://github.com/etrkk5/stratagent#readme"

[project.scripts]
stratagent = "stratagent.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stratagent = ["data/*.json"]
