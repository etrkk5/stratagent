name: tests
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  unit:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.11'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Download reviewed runtime dependency wheels
        run: >-
          python -m pip download --only-binary=:all: --no-deps PyYAML==6.0.3 --dest dist
      - name: Install built wheel
        run: python -m pip install --no-index --force-reinstall --find-links dist stratagent-cli
      - name: Source tests
        run: python scripts/run_tests.py --timeout 600
        env:
          PYTHONPATH: src
      - name: Installed-wheel tests
        run: python scripts/run_tests.py --timeout 600
      - run: python scripts/validate_lifecycle.py
      - run: python scripts/validate_cli.py
      - run: python -m pip check
      - run: python -m compileall -q src tests scripts
