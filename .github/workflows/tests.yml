name: tests
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  unit:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.11'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned release toolchain
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Build wheel
        run: python -m pip wheel . --no-build-isolation --no-deps --wheel-dir dist
      - name: Download reviewed runtime dependency wheels
        run: >-
          python -m pip download --only-binary=:all: --no-deps PyYAML==6.0.3 --dest dist
      - name: Install built wheel
        run: python -m pip install --no-index --force-reinstall --find-links dist stratagent-cli
      - name: Source tests
        run: python scripts/run_tests.py --timeout 600
        env:
          PYTHONPATH: src
      - name: Installed-wheel tests
        run: python scripts/run_tests.py --timeout 600
      - run: python scripts/validate_lifecycle.py
      - run: python scripts/validate_cli.py
      - run: python -m pip check
      - run: python -m compileall -q src tests scripts
      - name: Reproduce source/wheel and inspect runtime inventory
        run: python scripts/release.py build --source . --output dist/release --wheelhouse dist
      - name: Recheck release checksums, wheel RECORDs and SBOM
        run: python scripts/release.py verify --output dist/release
      - name: Disposable offline distribution install and uninstall
        run: python scripts/validate_distribution.py --bundle dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stratagent-preview-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
