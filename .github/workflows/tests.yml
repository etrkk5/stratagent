name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: stratagent plan "FastAPI and React dashboard with authentication and privacy" --workspace examples/projects/saas --scan-project
      - run: stratagent demo --workspace /tmp/stratagent-ci-demo --apply
      - run: stratagent verify --workspace /tmp/stratagent-ci-demo
      - run: stratagent init "Small Python API without payments" --workspace /tmp/stratagent-blueprint-ci --platforms generic
      - run: stratagent decision-request --workspace /tmp/stratagent-blueprint-ci
      - run: stratagent blueprint --workspace /tmp/stratagent-blueprint-ci --content
